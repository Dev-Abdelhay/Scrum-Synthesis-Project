<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connexion – GDP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="authen.css">
</head>
<body>

<p class="page-title">Connectez-vous à votre espace de gestion agile</p>

<!-- LOGIN CARD -->
<div class="card">
  <div class="error-msg" id="errorMsg">Email ou mot de passe incorrect.</div>

  <!-- Email -->
  <div class="field">
    <label for="email">Email</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      <input type="email" id="email" placeholder="votre.email@example.com" autocomplete="email"/>
    </div>
  </div>

  <!-- Password -->
  <div class="field">
    <label for="password">Mot de passe</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="toggle-pass" id="togglePass" type="button" title="Afficher/Masquer">
        <svg id="eyeIcon" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <!-- Remember / Forgot -->
  <div class="row">
    <label class="remember">
      <input type="checkbox" id="remember"/> Se souvenir de moi
    </label>
    <a href="#" class="forgot">Mot de passe oublié ?</a>
  </div>

  <!-- Submit -->
  <button class="btn-login" id="loginBtn">
    <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Se connecter
  </button>
</div>

<!-- DEMO ACCOUNTS -->
<div class="demo-card">
  <div class="demo-title">
    <span>💡</span> Comptes de démonstration
  </div>

  <div class="demo-account" onclick="fillDemo('marie.dupont@email.com')">
    <div class="demo-name">Scrum Master</div>
    <div class="demo-email">marie.dupont@email.com</div>
  </div>
  <div class="demo-account" onclick="fillDemo('vous@email.com')">
    <div class="demo-name">Développeur Frontend</div>
    <div class="demo-email">vous@email.com</div>
  </div>
  <div class="demo-account" onclick="fillDemo('jean.martin@email.com')">
    <div class="demo-name">Développeur Backend</div>
    <div class="demo-email">jean.martin@email.com</div>
  </div>
</div>

<script src="athen.js"></script>
</body>
</html>
